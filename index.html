<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP SIGN INVENTORY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300..700;1,400..700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<aside id="panel">
  <header>
    <h1>SIGN INVENTORY</h1>
    <p class="sub">Street-level sign map with standard sign codes</p>
  </header>

  <section class="step" id="step-area">
    <h2><span>1</span>AREA</h2>
    <div class="btns">
      <button id="btn-test" class="primary">HUNTINGTON DR S (VERIFIED)</button>
      <button id="btn-view">USE MAP VIEW</button>
      <button id="btn-draw">DRAW BOX</button>
    </div>
    <p class="hint" id="area-hint">Pick the test area, or frame any area and use the map view.</p>
  </section>

  <section class="step" id="step-load">
    <h2><span>2</span>LOAD</h2>
    <div class="bar"><div id="bar-fill"></div></div>
    <p class="status" id="status">Waiting for an area.</p>
  </section>

  <section class="step grow" id="step-inv">
    <h2><span>3</span>INVENTORY <em id="inv-count"></em></h2>
    <div class="legend">
      <span><i class="dot verified"></i>VERIFIED</span>
      <span><i class="dot auto"></i>AUTO</span>
      <span><i class="dot nomatch"></i>NO CODE</span>
      <span><i class="dot unreadable"></i>UNREADABLE</span>
    </div>
    <div class="tablewrap"><table id="inv"><thead><tr><th></th><th>CODE</th><th>SIGN</th><th>QTY</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section class="step" id="step-export">
    <h2><span>4</span>EXPORT</h2>
    <div class="btns">
      <button id="btn-pdf">PDF 11X17</button>
      <button id="btn-xlsx">EXCEL</button>
    </div>
  </section>
</aside>

<main id="map"></main>

<!-- 11x17 sheet parts, shown only in print -->
<section id="sheet-side">
  <img class="wordmark" src="img/wordmark-slate.png" alt="Fehr &amp; Peers">
  <h1 id="sheet-title">SIGN INVENTORY</h1>
  <p id="sheet-meta"></p>
  <table id="sheet-table"><thead><tr><th></th><th>CODE</th><th>SIGN</th><th>QTY</th></tr></thead><tbody></tbody></table>
  <p id="sheet-notes"></p>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
