name: probe
on:
  push:
    paths: ['probes/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probes/probe.py > probes/result.txt 2>&1 || true
      - run: |
          git config user.name "probe-bot"; git config user.email "actions@users.noreply.github.com"
          git add probes/result.txt probes/*.json; git commit -m "Probe result" || exit 0; git pull --rebase && git push
