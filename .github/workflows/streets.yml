name: streets
on:
  push:
    paths: ['requests/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch street network for each requested area
        run: |
          mkdir -p data/osm
          for f in requests/*.json; do
            k=$(basename $f .json)
            bb=$(python3 -c "import json;b=json.load(open('$f'))['bbox'];print(f'{b[1]},{b[0]},{b[3]},{b[2]}')")
            q="[out:json][timeout:120];(way[\"highway\"~\"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link|service)$\"]($bb);node[\"highway\"~\"^(stop|give_way|traffic_signals|crossing)$\"]($bb););out geom;"
            for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              code=$(curl -s -m 180 -A "fp-sign-inventory/1.0 (github.com/drzkid96)" -w "%{http_code}" --data-urlencode "data=$q" "$u" -o data/osm/$k.json) || code=fail; echo "$u $code"
              [ "$code" = "200" ] && break; sleep 5
            done
          done
      - name: Commit
        run: |
          git config user.name "streets-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/osm; git commit -m "Street network for requested areas" || exit 0
          git pull --rebase; git push
