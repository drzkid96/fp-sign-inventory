name: County base
on:
  workflow_dispatch:
  push:
    paths: ['requests/base.json']
permissions:
  contents: write
concurrency: { group: base, cancel-in-progress: false }
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          pip install -q geopandas pyogrio pandas
          sudo apt-get -qq update && sudo apt-get -qq install -y build-essential libsqlite3-dev zlib1g-dev >/dev/null
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -s -C /tmp/tc -j4 && sudo make -s -C /tmp/tc install
      - name: Census and LEHD inputs
        run: |
          mkdir -p /tmp/in && cd /tmp/in
          T=https://www2.census.gov/geo/tiger/TIGER2025
          curl -sfO $T/ROADS/tl_2025_06037_roads.zip; curl -sfO $T/COUNTY/tl_2025_us_county.zip
          curl -sfO $T/UAC20/tl_2025_us_uac20.zip; curl -sfO $T/PLACE/tl_2025_06_place.zip
          L=https://lehd.ces.census.gov/data/lodes/LODES8/ca
          curl -sfO $L/wac/ca_wac_S000_JT00_2022.csv.gz; curl -sfO $L/rac/ca_rac_S000_JT00_2022.csv.gz; curl -sfO $L/ca_xwalk.csv.gz
      - name: OSM arterials
        if: ${{ !contains(github.event.head_commit.message, '[agency only]') }}
        run: python3 pipeline/fetch_osm_art.py /tmp/in
      - name: Priority tiles
        if: ${{ !contains(github.event.head_commit.message, '[agency only]') }}
        run: python3 pipeline/base_tiles.py /tmp/in .
      - name: Agency layers
        continue-on-error: true
        run: |
          python3 pipeline/fetch_agency.py /tmp/ag
          cp /tmp/ag/summary.json data/base/agency.json
          for k in signs striping markings signals; do [ -s /tmp/ag/county_$k.geojson ] || echo '{"type":"FeatureCollection","features":[]}' > /tmp/ag/county_$k.geojson; done
          rm -f data/base/agency.pmtiles*
          tippecanoe -q -o data/base/agency.pmtiles --force -zg -Z9 --maximum-zoom=16 --drop-densest-as-needed --extend-zooms-if-still-dropping \
            -L signs:/tmp/ag/county_signs.geojson -L striping:/tmp/ag/county_striping.geojson \
            -L markings:/tmp/ag/county_markings.geojson -L signals:/tmp/ag/county_signals.geojson
          ls -la data/base
      - name: Commit
        run: |
          git config user.name "inventory-bot"; git config user.email "actions@users.noreply.github.com"
          rm -f data/base/*-journal; git add -A data/base && git commit -qm "County base layers" && git pull -q --rebase -X theirs && git push -q || echo "nothing to commit"
